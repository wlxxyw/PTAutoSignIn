[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

; 添加 Supervisor Web 管理界面，监听 9001 端口
[inet_http_server]
port=0.0.0.0:%(ENV_SUPERVISOR_WEB_PORT)s
username=%(ENV_SUPERVISOR_WEB_USERNAME)s
password=%(ENV_SUPERVISOR_WEB_USERNAME)s

; 虚拟显示服务
[program:xvfb]
command=Xvfb :99 -screen 0 %(ENV_SCREEN_WIDTH)sx%(ENV_SCREEN_HEIGHT)sx%(ENV_SCREEN_DEPTH)s -ac
autorestart=true

; 轻量窗口管理器
[program:fluxbox]
command=fluxbox
autorestart=true

; VNC 服务
[program:x0vncserver]
command=/bin/sh /etc/supervisor/conf.d/start_vnc.sh
autorestart=true

; Chrome 浏览器：不自动启动，需通过 Supervisor Web API 或界面手动启动, chrome的安全限制 仅能本地访问
[program:chrome]
command=/bin/sh /etc/supervisor/conf.d/start_chromium.sh
autostart=false
autorestart=false
