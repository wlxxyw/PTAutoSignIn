- domain: "baidu.com" #作为 浏览器标签页的筛选
  date: "2026-05-13"  #上一次执行日期
  status: 0           #失败次数
  pause: false        #暂停此任务
  retry: false        #true 失败关闭页面 下一次重试，false 失败了停在失败页面 等待人工处理
  actions:
    - goto: "https://www.baidu.com" # 原来的访问页面
    # 检查直到指定元素的存在,使用原生css选择器 会有超时时间
    - wait: "#chat-input-area" 
    # 执行JS
    - action: |
        document.querySelectorAll("textarea#chat-textarea")[0].value = "武汉今天天气"
    - action: |
        document.querySelector("#search_submit").click()
    # 与 wait的区别是不会重试 且返回false 就中断 响应失败
    - check: "#chat-input-area" 
    # 将直接执行JS
    - cwait: |
        if(!!count)count = 1;
        if(count < 5){
          count++;
          return false;
        }else{
          return true;
        }
    # 执行JS, 并且不会重试
    - ccheck: |
        Math.random() > 0.5
- domain: pt1.example.com  #常见无验证码PHP pt站示例
  date: "2026-05-13"
  status: 0
  pause: false
  retry: false
  actions:
    - goto: https://pt1.example.com
    - wait: .head
    - goto: https://pt1.example.com/attendance.php
    - wait: .head
    - ccheck: |
        return !!Array.from(document.querySelectorAll('h2')).find(h2=>h2.textContent.includes('签到成功'));        
- domain: "pt.example.com" #常见简单图形验证码PHP pt站示例
  date: "2026-05-13"
  status: 0
  pause: false                                         # true 表示暂停该站点的任务
  retry: true                                          # 由于 ocr 准确性问题，该站点设为重试，失败后下次从头开始，而不是停在失败的页面等待人工处理
  actions:
    - goto: https://pt.example.com                     # 访问首页
    - wait: table#info_block                           # 等待用户信息的出现
    - goto: https://pt.example.com/attendance.php
    - ccheck: |
        // 处理验证码
        // 1. 获取图片元素
        const img = document.querySelector('img[alt="CAPTCHA"]');
        const input = document.querySelector('input[name="imagestring"]');
        if (!img) {
            return true; //无验证码 直接跳过
        }
        if (!input) {
            throw new Error('未找到 name="imagestring" 的输入框');
        }
        // 2. 等待图片加载完成（如果未加载）
        if (!img.complete) {
            await new Promise((resolve, reject) => {
                img.onload = resolve;
                img.onerror = () => reject(new Error('图片加载失败'));
            });
        }
        // 3. 将图片转为纯 Base64（使用 Canvas）
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth || img.width;
        canvas.height = img.naturalHeight || img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const fullDataUrl = canvas.toDataURL('image/png');
        const base64Data = fullDataUrl.split('base64,')[1];
        // 4. 发送 POST 请求到 ocr 接口 需要按照OCR API接口修改
        const response = await fetch('https://ocr.example.com/api', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Token': 'asdfghjklzxcvbnmqwertyuiop' },
            body: JSON.stringify({ image: base64Data })
        });
        // 5. 解析响应 需要按照OCR API接口修改
        if (!response.ok) {
            const errData = await response.json();
            throw new Error(`OCR 请求失败: ${errData.error}`);
        }
        const result = await response.json();
        if(!result.result && result.result.length != 6){
            throw new Error('OCR 解析失败');
        }
        // 6. 将识别结果填入 input
        input.value = result.result || '';
        return true;
    - action: |
        const img = document.querySelector('img[alt="CAPTCHA"]');
        const submit = document.querySelector('input[type="submit"]');
        if(!!img && !!submit)submit.click();
    - action: |
        // 不论上两步 是否成功签到 重新进入一次签到页面
        window.document.location.href = "https://pt.example.com/attendance.php"
    - wait: table#info_block                           # 等待用户信息的出现
    - check: h2:contains("签到成功")                    # 检测签到成功的信息   