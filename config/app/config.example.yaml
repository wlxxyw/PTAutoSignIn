# 简单验证码
- domain: example8.com # 比如使用 数字验证码的 奥申
  date: 10/16/2026
  status: 0
  pause: false
  retry: true # 验证码不保证一次成功，建议打开重试
  actions:
    - goto: https://example8.com/torrents.php
    - wait: .head  
    - goto: https://example8.com/attendance.php
    - wait: .head
    - ccheck: |
        // 1. 获取图片元素
        const img = document.querySelector('img[alt="CAPTCHA"]');
        const input = document.querySelector('input[name="imagestring"]');
        if (!img) {
            return true; //无验证码 直接跳过
        }
        if (!input) {//有验证码 没输入框
            throw new Error('未找到 name="imagestring" 的输入框');
        }
        // 2. 等待图片加载完成（如果未加载）
        if (!img.complete) {
            await new Promise((resolve, reject) => {
                img.onload = resolve;
                img.onerror = () => reject(new Error('图片加载失败'));
            });
        }
        // 3. 将图片转为纯 Base64（使用 Canvas）
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth || img.width;
        canvas.height = img.naturalHeight || img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const fullDataUrl = canvas.toDataURL('image/png');
        const base64Data = fullDataUrl.split('base64,')[1];
        // 4. 将图片发送 POST 请求到 ORC 服务
        const response = await fetch('http://127.0.0.1:8000/ocr', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: base64Data })
        });
        // 5. 解析响应
        if (!response.ok) {
            const errData = await response.json();
            throw new Error(`OCR 请求失败: ${errData.error}`);
        }
        const result = await response.json();
        if(!result.result && result.result.length != 6){
            throw new Error('OCR 解析失败');
        }
        // 6. 将识别结果填入 input
        input.value = result.result || '';
        return true;
    - action: |
        const img = document.querySelector('img[alt="CAPTCHA"]');
        const submit = document.querySelector('input[type="submit"]');
        if(!!img && !!submit)submit.click();
    - wait: .head
    - ccheck: |
        const h2s = document.querySelectorAll('h2');
        for (let h2 of h2s) {
          if (h2.textContent.includes('Error')) return false;
          if (h2.textContent.includes('签到成功')) return true;
        }
        return false;
# altcha 人机验证
- domain: example9.com # 比如使用 altcha 的 野马
  date: 10/16/2026
  status: 0
  pause: false
  retry: true # 人机验证不保证一次成功，需打开重试
  actions:
    - goto: https:/example9.com/#/index
    - cwait: |-
        return Array.from(document.querySelectorAll('button')).filter(button=>button.textContent.includes('前往签到')).length > 0;
    - goto: https://example9.com/#/user/growth?tab=checkIn
    - cwait: |-
        return Array.from(document.querySelectorAll('h2')).filter(button=>button.textContent.includes('成长中心')).length > 0;
    - switch:
        # 如果不存在人机验证(比如已经签到过了)，会直接跳过这套actions
        - check: altcha-widget
          actions:
            - wait: .altcha-checkbox
            - action: |-
                // 获取验证框的位置， 生成鼠标轨迹，返回到上下文中
                const box = document.querySelector('.altcha-checkbox');
                const rect = box.getBoundingClientRect();
                const targetX = rect.left + rect.width * Math.random();
                const targetY = rect.top + rect.height * Math.random();
                let startX = Math.random() * window.innerWidth * 0.5;
                let startY = Math.random() * window.innerHeight * 0.5;
                const steps = 10 + Math.floor(Math.random() * 10);
                const points = [];
                for (let i = 0; i <= steps; i++) {
                    const t = i / steps;
                    const ctrlX = (startX + targetX) / 2 + (Math.random() - 0.5) * 200;
                    const ctrlY = (startY + targetY) / 2 + (Math.random() - 0.5) * 200;
                    const x = Math.pow(1 - t, 2) * startX + 2 * (1 - t) * t * ctrlX + Math.pow(t, 2) * targetX;
                    const y = Math.pow(1 - t, 2) * startY + 2 * (1 - t) * t * ctrlY + Math.pow(t, 2) * targetY;
                    points.push({ x: Math.round(x), y: Math.round(y) });
                }
                return {
                    altchaPath: points,
                    altchaPath0: points.length>0?points[0]:null,
                    clickTarget: {
                        x: Math.round(targetX),
                        y: Math.round(targetY)
                    }
                };
            # 模拟鼠标移动操作：循环获取上下文中第一个轨迹点，然后移动鼠标，再删掉第一个轨迹点，直到完成所有轨迹点
            - loop:
                ccheck: return !!$ctx.altchaPath0;
                actions:
                  - cdp:
                      method: Input.dispatchMouseEvent
                      params:
                        type: mouseMoved
                        x: '{{altchaPath0.x}}'
                        'y': '{{altchaPath0.y}}'
                  - action: |-
                      function sleep(ms) {
                        return new Promise(resolve => setTimeout(resolve, ms));
                      }
                      await sleep(50+Math.random()*100);
                      let points = $ctx.altchaPath; points.splice(0,1);
                      return {
                        altchaPath: points,
                        altchaPath0: points.length>0?points[0]:null
                      };
            - action: |
                await new Promise(r => setTimeout(r, 80 + Math.random() * 70));
            # 模拟鼠标点击操作
            - cdp:
                method: Input.dispatchMouseEvent
                params:
                  type: mousePressed
                  x: '{{clickTarget.x}}'
                  'y': '{{clickTarget.y}}'
                  button: left
                  clickCount: 1
            - action: |
                await new Promise(r => setTimeout(r, 60 + Math.random() * 90));
            - cdp:
                method: Input.dispatchMouseEvent
                params:
                  type: mouseReleased
                  x: '{{clickTarget.x}}'
                  'y': '{{clickTarget.y}}'
                  button: left
                  clickCount: 1
            # 等待人机验证通过
            - cwait: |
                const hidden = document.querySelector('input[type="hidden"]');
                return hidden && hidden.value !== undefined && !!hidden.value;
            - action: >-
                const submits =
                Array.from(document.querySelectorAll('button')).filter(button=>button.textContent.includes('立即签到'));

                if (submits.length) submits[0].click();
    - wait: button[disabled]
  lastFailNotifyDate: 10/15/2026
# 嵌入式 cloudflare 验证
- domain: example10.com # 比如使用 cloudflare 盾的loli
  date: 10/16/2026
  status: 0
  pause: false
  retry: true # 人机验证不保证一次成功，需打开重试
  actions:
    - goto: https://example10.com/
    - wait: table#info_block
    - goto: https://example10.com/attendance.php
    - wait: table#info_block
    - switch:
        - check: div.cf-turnstile
          actions:
            # 等待 cf 盾加载
            - loop:
                ccheck: |-
                  const el = document.querySelector('div.cf-turnstile');
                  const r = el.getBoundingClientRect();
                  if(r.width > 250 && r.width < 350 && r.height > 50 && r.height < 80 )return false;
                  return true;
                actions:
                  - action: await new Promise(r => setTimeout(r, 1000));
            - action: await new Promise(r => setTimeout(r, 10*1000)); 
            - action: |-
                // 获取验证框的位置， 生成鼠标轨迹，返回到上下文中
                const el = document.querySelector('div.cf-turnstile');
                const rect = el.getBoundingClientRect(); 
                // 由于嵌入式cf盾使用iframe, 无法获取到勾选框准确位置 这里取大概的 (22, 32)
                const targetX = rect.left + 22; 
                const targetY = rect.top + 32; 
                let startX = Math.random() * window.innerWidth * 0.5; 
                let startY = Math.random() * window.innerHeight * 0.5; 
                const steps = 10 + Math.floor(Math.random() * 10); 
                const points = []; 
                for (let i = 0; i <= steps; i++) {
                    const t = i / steps;
                    const ctrlX = (startX + targetX) / 2 + (Math.random() - 0.5) * 200;
                    const ctrlY = (startY + targetY) / 2 + (Math.random() - 0.5) * 200;
                    const x = Math.pow(1 - t, 2) * startX + 2 * (1 - t) * t * ctrlX + Math.pow(t, 2) * targetX;
                    const y = Math.pow(1 - t, 2) * startY + 2 * (1 - t) * t * ctrlY + Math.pow(t, 2) * targetY;
                    points.push({ x: Math.round(x), y: Math.round(y) });
                } 
                return {
                    altchaPath: points,
                    altchaPath0: points.length>0?points[0]:null,
                    clickTarget: {
                        x: Math.round(targetX),
                        y: Math.round(targetY)
                    },
                    clickTargetRandom: {
                        x: Math.round(targetX),
                        y: Math.round(targetY)
                    }
                };
            - loop:
                ccheck: return !!$ctx.altchaPath0;
                actions:
                  - cdp:
                      method: Input.dispatchMouseEvent
                      params:
                        type: mouseMoved
                        x: '{{altchaPath0.x}}'
                        'y': '{{altchaPath0.y}}'
                  - action: |-
                      function sleep(ms) {
                        return new Promise(resolve => setTimeout(resolve, ms));
                      }
                      await sleep(50+Math.random()*100);
                      let points = $ctx.altchaPath; points.splice(0,1);
                      return {
                        altchaPath: points,
                        altchaPath0: points.length>0?points[0]:null
                      };
            # 模拟鼠标点击操作
            - cdp:
                method: Input.dispatchMouseEvent
                params:
                  type: mousePressed
                  x: '{{clickTarget.x}}'
                  'y': '{{clickTarget.y}}'
                  button: left
                  clickCount: 1
            - action: |
                await new Promise(r => setTimeout(r, 60 + Math.random() * 90));
            - cdp:
                method: Input.dispatchMouseEvent
                params:
                  type: mouseReleased
                  x: '{{clickTarget.x}}'
                  'y': '{{clickTarget.y}}'
                  button: left
                  clickCount: 1    
            # 等待人机验证通过
            - cwait: |
                const hidden = document.querySelector('input[type="hidden"][name="cf-turnstile-response"]');
                return hidden && ( hidden.value === undefined || !hidden.value);
            - action: |-
                const submit = document.querySelector('input[type="submit"][value="立即签到"]');
                if (submit) submit.click();
                await new Promise(r => setTimeout(r, 1000));
            - wait: table#info_block
    - ccheck: |
        const h2 = document.querySelector('h2');
        return h2 && h2.textContent.includes('签到成功');
  lastFailNotifyDate: 10/12/2026
# 非PT站点  
- domain: fengchao.chat # 比如 蜂巢
  date: 10/16/2026
  status: 0
  pause: false
  retry: false
  actions:
    - goto: https://fengchao.chat/
    - cwait: |
        let waiting = document.querySelectorAll('a[href^="/users/"]');
        return !!waiting.length;
    - ccheck: |
        // 使用 ccheck 代替 action 来执行签到动作， 返回false直接整个流程失败
        let checkInButton = Array.from(document.querySelectorAll('button[type="button"]')).find(el=>el.textContent.trim().includes('签到'));
        if(!!checkInButton && checkInButton.textContent.trim() === '已签到')return true;
        const res = await fetch('/api/check-in',
            {
                method: 'POST',
                body: JSON.stringify({ action: 'check-in' }),
                headers: {
                    'Content-Type': 'application/json',
                    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36'
                }
            }
        );
        if(res.status == 200)return true;
        return false;
    - goto: https://fengchao.chat/
    - cwait: |
        let waiting = document.querySelectorAll('a[href^="/users/"]');
        return !!waiting.length;
    - ccheck: |
        return !!Array.from(document.querySelectorAll('button[type="button"]')).find(el=>el.textContent.trim() === '已签到');
