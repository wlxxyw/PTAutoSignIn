## 注意 yaml 注释会在执行一次脚本后丢失，js 注释会照样保留

# domain 站点，最好是域名的一部分，用于判断浏览器是否有已经打开的相关页面
# date 上一次是那一天执行的，当 date 是今天且 status==0, 今天就不会再执行该站点
# expireDate 过期时间， 超过这一天后 将 pause 设为 true
# lastFailNotifyDate 上一次失败发送通知的日期，避免重复发送，该字段自动填充不需要设置
# status 0 表示成功 非0 表示失败的次数
# pause 此次执行是否跳过该站点
# retry 
#      true  流程失败后 会关闭tab页,下一次执行脚本会重试该站点
#      false 流程失败后 会保留tab页, 可以VNC连接后手动操作，保留的页面被关闭后下一次执行脚本自动设为成功
# actions: 流程
#   goto    打开指定页面
#   wait    等待指定页面元素的出现 超时结束整个流程
#   check   检查指定页面元素的出现 不存在结束整个流程
#   cwait   执行脚本直到返回true 超时结束整个流程
#   ccheck  执行脚本 返回false直接结束整个流程
#   action  执行脚本 若返回非空对象 将返回值合并(覆盖)到上下文中，cwait/ccheck/action 代码中可使用 $ctx调用，cdp 的参数可以使用{{}}方式引用
#   switch  条件语句，第一个满足 check/ccheck 的分支下的 actions 会被执行,后续条件即使也满足也不会执行
#   loop    循环语句，可指定循环次数(times) 或者 指定 循环条件(check/ccheck, 同时可知道最大循环次数 maxTimes 默认100)，循环执行 actions
#   cdp     高级功能，直接执行原生cdp命令

